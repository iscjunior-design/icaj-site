    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 0 22px; border-radius: 10px; background: #1D63ED; color: #FFFFFF;
      text-decoration: none; font-weight: 600; font-size: 0.92rem;
    }
    a:hover { background: #154EC2; }
    a:focus-visible { outline: 2px solid #1D63ED; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      body { background: #06080C; color: #F1F5F9; }
      .box { background: #0E121A; border-color: #1E293B; }
      p { color: #A9B6C6; }
      a { background: #2563EB; }
